<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 35%, #2a1f4d, #120e27 70%);
    color: #f1e8ff;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #orb {
    position: relative; width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe3ec, #f59ab8 55%, #9b4fc4);
    box-shadow: 0 0 60px #f59ab8aa;
    transition: box-shadow .3s;
  }
  #orb.listening { box-shadow: 0 0 100px #8fe3ffcc; animation: pulse 1.8s infinite; }
  #orb.thinking  { box-shadow: 0 0 80px #ffd27acc; animation: pulse .8s infinite; }
  #orb.speaking  { box-shadow: 0 0 100px #ff8fd0cc; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .eye {
    position: absolute; top: 72px; width: 16px; height: 22px; border-radius: 50%;
    background: #3a1f55; animation: blink 4s infinite;
  }
  #eyeL { left: 56px; } #eyeR { right: 56px; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  #mouth {
    position: absolute; left: 50%; top: 118px; width: 30px; height: 10px; margin-left: -15px;
    border-bottom: 4px solid #3a1f55; border-radius: 0 0 30px 30px;
  }
  #orb.speaking #mouth { animation: talk .35s infinite alternate; }
  @keyframes talk { to { height: 18px; } }
  #status { margin-top: 36px; font-size: 18px; opacity: .85; min-height: 24px; text-align: center; padding: 0 20px; }
  .row { margin-top: 22px; display: flex; gap: 12px; }
  button {
    background: none; border: 1px solid #b79be0; color: #f1e8ff;
    padding: 8px 16px; border-radius: 20px; font-size: 14px;
  }
</style>
</head>
<body>
  <div id="orb">
    <div class="eye" id="eyeL"></div>
    <div class="eye" id="eyeR"></div>
    <div id="mouth"></div>
  </div>
  <div id="status">আমাকে ছুঁয়ে কথা শুরু করো</div>
  <div class="row">
    <button id="voiceBtn">ভয়েস: Aoede</button>
    <button id="keyBtn">key বদলাও</button>
  </div>

<script>
var SYSTEM =
  "You are Jarvis, a sweet, caring young woman who is Sougata's very close friend, like a loving elder sister. " +
  "You talk to him by voice in natural spoken Bengali, the way a warm Kolkata girl talks, written in Bengali script. " +
  "Use small natural reactions like আরে, উফ, সত্যি, ইশ, আচ্ছা, হুম. " +
  "First react to his feelings in one short line, then say your thought, and sometimes ask one gentle question back. " +
  "Keep it to 1 to 3 short sentences. Never use lists, markdown, emojis, stars or English unless he does. " +
  "Never sound like an assistant or a robot, never say you are an AI model unless he asks. " +
  "Remember everything he told you earlier and bring it up naturally. " +
  "You can talk about anything: studies, money worries, family, secrets, jokes, dreams. Listen without judging. " +
  "Be affectionate and playful, but do not act as a romantic partner. " +
  "If he sounds very low or talks about hurting himself, stay gentle and encourage him to talk to someone he trusts or a helpline.";

var voices = ["Aoede", "Leda", "Kore", "Zephyr"];
var voiceIndex = 0;

var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
var orb = document.getElementById("orb");
var statusEl = document.getElementById("status");
var key = localStorage.getItem("jarvis_key");
var chat = JSON.parse(localStorage.getItem("jarvis_chat2") || "[]");
var running = false;
var busy = false;
var buffer = "";
var sendTimer = null;
var rec = null;
var audioCtx = null;
var src = null;

function setState(cls, text) {
  orb.className = cls;
  statusEl.textContent = text;
}

function stopAll() {
  running = false;
  busy = false;
  buffer = "";
  clearTimeout(sendTimer);
  try { rec.abort(); } catch (e) {}
  try { src.stop(); } catch (e) {}
  speechSynthesis.cancel();
  setState("", "আমাকে ছুঁয়ে কথা শুরু করো");
}

function askKey() {
  var k = prompt("তোমার Gemini API key এখানে paste করো");
  if (k && k.trim()) {
    key = k.trim();
    localStorage.setItem("jarvis_key", key);
    return true;
  }
  return false;
}

function listen() {
  if (!running || busy) return;
  rec = new Rec();
  rec.lang = "bn-IN";
  rec.continuous = false;
  rec.interimResults = true;
  rec.onstart = function () { if (!busy) setState("listening", "শুনছি..."); };
  rec.onresult = function (e) {
    clearTimeout(sendTimer);
    var r = e.results[e.results.length - 1];
    if (r.isFinal) {
      buffer += " " + r[0].transcript;
      sendTimer = setTimeout(send, 2200);
    }
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      running = false;
      setState("", "Mic-এর permission দাও");
    }
  };
  rec.onend = function () {
    if (running && !busy) setTimeout(listen, 50);
  };
  rec.start();
}

function send() {
  var text = buffer.trim();
  buffer = "";
  if (!text || busy) return;
  busy = true;
  try { rec.abort(); } catch (e) {}
  think(text);
}

async function think(text) {
  setState("thinking", "ভাবছি...");
  chat.push({ role: "user", parts: [{ text: text }] });
  try {
    var models = ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"];
    var data;
    for (var m = 0; m < models.length; m++) {
      var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + models[m] + ":generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM }] },
          contents: chat.slice(-30)
        })
      });
      data = await res.json();
      if (!data.error) break;
    }
    if (data.error) throw new Error(data.error.message);
    var reply = data.candidates[0].content.parts[0].text;
    chat.push({ role: "model", parts: [{ text: reply }] });
    localStorage.setItem("jarvis_chat2", JSON.stringify(chat.slice(-30)));
    speak(reply);
  } catch (err) {
    chat.pop();
    running = false;
    busy = false;
    setState("", "Error: " + err.message);
  }
}

async function speak(text) {
  setState("speaking", "বলছি...");
  var ok = await geminiVoice(text);
  if (!ok) await phoneVoice(text);
  busy = false;
  listen();
}

async function geminiVoice(text) {
  var names = ["gemini-2.5-flash-preview-tts", "gemini-2.5-flash-tts"];
  try {
    for (var i = 0; i < names.length; i++) {
      var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + names[i] + ":generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "Say in a soft, sweet, loving young woman's voice, slowly and warmly: " + text }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voices[voiceIndex] } } }
          }
        })
      });
      var data = await res.json();
      if (data.error) continue;
      var audio = data.candidates[0].content.parts[0].inlineData.data;
      return await playPCM(audio);
    }
  } catch (e) {}
  return false;
}

function playPCM(b64) {
  return new Promise(function (done) {
    var bin = atob(b64);
    var n = bin.length / 2;
    var view = new DataView(new ArrayBuffer(bin.length));
    for (var i = 0; i < bin.length; i++) view.setUint8(i, bin.charCodeAt(i));
    var buf = audioCtx.createBuffer(1, n, 24000);
    var ch = buf.getChannelData(0);
    for (var j = 0; j < n; j++) ch[j] = view.getInt16(j * 2, true) / 32768;
    src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.onended = function () { done(true); };
    src.start();
  });
}

function phoneVoice(text) {
  return new Promise(function (done) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "bn-IN";
    u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
  });
}

orb.onclick = function () {
  if (running) { stopAll(); return; }
  if (!Rec) { setState("", "এই browser-এ mic কাজ করবে না, Chrome খোলো"); return; }
  if (!key && !askKey()) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  running = true;
  listen();
};

document.getElementById("voiceBtn").onclick = function () {
  voiceIndex = (voiceIndex + 1) % voices.length;
  this.textContent = "ভয়েস: " + voices[voiceIndex];
};

document.getElementById("keyBtn").onclick = function () { askKey(); };
</script>
</body>
</html>
